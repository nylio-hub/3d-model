name: Build and Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Проверка наличия основных файлов проекта..."
          test -f index.html && echo "index.html найден" || exit 1
          test -f css/style.css && echo "style.css найден" || exit 1
          test -f js/common.js && echo "common.js найден" || exit 1
          test -f js/data.js && echo "data.js найден" || exit 1
          test -f assets/logo.svg && echo "logo.svg найден" || exit 1
          test -f package.json && echo "package.json найден" || exit 1
          test -f server/index.js && echo "server/index.js найден" || exit 1
          test -f server/schema.sql && echo "schema.sql найден" || exit 1
          echo "Все основные файлы на месте!"

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t 3d-model:ci .

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker tag 3d-model:ci ghcr.io/${{ github.repository }}:latest
          docker tag 3d-model:ci ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
